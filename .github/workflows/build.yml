name: Build JPG Container

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Application
        run: |
          pyinstaller ^
            --clean ^
            --noconfirm ^
            --windowed ^
            --name JPGContainer ^
            src/main.py

      - name: Verify Build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\JPGContainer\JPGContainer.exe")) {
            Write-Error "JPGContainer.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Build berhasil."

      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: JPGContainer-Windows
          path: dist/JPGContainer
