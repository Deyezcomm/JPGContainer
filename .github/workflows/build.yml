name: Build JPG Container

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Portable EXE
        run: |
          pyinstaller --onefile --windowed --name JPGContainer src/main.py

      - name: Check EXE
        run: |
          if (!(Test-Path "dist\JPGContainer.exe")) {
            Write-Error "JPGContainer.exe tidak ditemukan!"
            exit 1
          }

          Write-Host "JPGContainer.exe berhasil dibuat."

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JPGContainer-Windows
          path: dist/JPGContainer.exe
